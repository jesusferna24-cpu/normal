<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gobierno Estudiantil - Votación en la Nube</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Chart.js y PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #f0f2f5; padding: 20px; min-height: 100vh; }
        .app-container { max-width: 1400px; margin: 0 auto; }
        .school-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white; padding: 20px 30px; border-radius: 28px;
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            justify-content: space-between; margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .logo-area { display: flex; align-items: center; gap: 20px; }
        .school-logo-img { width: 70px; height: 70px; object-fit: cover; border-radius: 50%; background: white; padding: 5px; border: 2px solid gold; }
        .school-info h2 { font-size: 1.7rem; margin-bottom: 5px; }
        .mode-buttons { display: flex; gap: 15px; }
        .mode-btn { background: rgba(255,255,255,0.2); border: none; padding: 10px 20px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .mode-btn.active { background: #ffc107; color: #1e3c72; }
        .card { background: white; border-radius: 28px; padding: 25px; margin-bottom: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .admin-panel { border-top: 6px solid #ff9800; }
        .voting-panel { border-top: 6px solid #4caf50; }
        .section-title { font-size: 1.6rem; margin-bottom: 20px; color: #1e3c72; border-left: 7px solid #ff9800; padding-left: 18px; }
        .admin-buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .admin-btn { background: #2c3e66; color: white; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: bold; }
        .admin-btn.danger { background: #c0392b; }
        .admin-btn.warning { background: #e67e22; }
        .admin-btn.secondary { background: #7f8c8d; }
        .form-grid { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 20px; background: #f9f9fb; padding: 20px; border-radius: 24px; }
        .form-group { flex: 1; min-width: 180px; }
        label { font-weight: 600; display: block; margin-bottom: 6px; color: #2c3e66; }
        input, select { width: 100%; padding: 10px 12px; border-radius: 40px; border: 1px solid #ccc; outline: none; }
        .candidate-list, .student-list { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; }
        .candidate-card-admin, .student-card { background: #fef9e6; border-radius: 20px; padding: 12px; width: 210px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .candidate-img-small { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; margin: 5px auto; }
        .ballot-container { display: flex; flex-wrap: wrap; gap: 25px; justify-content: center; margin-top: 20px; }
        .candidate-card-vote { background: white; border-radius: 28px; width: 220px; padding: 15px; cursor: pointer; text-align: center; transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 2px solid transparent; position: relative; }
        .candidate-card-vote.selected { border: 3px solid #ff9800; background: #fff8e7; }
        .photo-wrapper { position: relative; width: 140px; height: 140px; margin: 0 auto 10px; }
        .candidate-photo { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .x-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 5rem; font-weight: bold; color: white; text-shadow: 2px 2px 0 red; backdrop-filter: blur(3px); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .candidate-card-vote.selected .x-overlay { opacity: 1; }
        .candidate-name { font-weight: bold; margin-top: 10px; font-size: 1.1rem; }
        .candidate-corriente { font-size: 0.8rem; color: #e67e22; font-style: italic; }
        .vote-btn { background: #2ecc71; color: white; border: none; padding: 12px 28px; border-radius: 40px; font-size: 1.1rem; margin-top: 20px; width: 100%; font-weight: bold; }
        .student-login-area { background: #eef2ff; padding: 20px; border-radius: 28px; margin-bottom: 25px; }
        .success-message { background: #d4edda; color: #155724; padding: 12px; border-radius: 40px; margin: 15px 0; }
        .results-summary { background: #e9ecef; padding: 15px; border-radius: 20px; margin-top: 20px; }
        .chart-container { max-width: 600px; margin: 20px auto; }
        footer { text-align: center; margin-top: 30px; color: gray; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="school-header" id="schoolHeader">
        <div class="logo-area">
            <img id="schoolLogoImg" class="school-logo-img" src="https://via.placeholder.com/70?text=Logo" alt="Logo">
            <div class="school-info">
                <h2 id="schoolNameDisplay">Cargando...</h2>
                <p>Gobierno Estudiantil - Elecciones</p>
            </div>
        </div>
        <div class="mode-buttons">
            <button id="voterModeBtn" class="mode-btn active">🗳️ Votar</button>
            <button id="adminModeBtn" class="mode-btn">🔧 Administración</button>
        </div>
    </div>

    <div id="voterSection" class="card voting-panel">
        <h3 class="section-title">📋 Papeleta Electrónica</h3>
        <div id="voterContent">
            <div class="student-login-area">
                <h4>🔐 Identificación del Estudiante</h4>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="text" id="studentIdInput" placeholder="Ingresa tu ID (ej: EST001)" style="flex:2">
                    <button id="loginStudentBtn" class="admin-btn" style="background:#2c3e66;">Iniciar sesión</button>
                    <button id="logoutStudentBtn" class="admin-btn secondary" style="display:none;">Cerrar sesión</button>
                </div>
                <div id="studentAuthMessage"></div>
            </div>
            <div id="ballotArea"></div>
            <div id="voteResultMessage"></div>
        </div>
    </div>

    <div id="adminSection" style="display: none;" class="card admin-panel">
        <h3 class="section-title">⚙️ Panel de Administración</h3>
        <div id="adminAuthArea"></div>
        <div id="adminConfigArea" style="display:none;">
            <div class="admin-buttons">
                <button id="showSchoolConfigBtn" class="admin-btn">🏫 Configurar Colegio</button>
                <button id="showCandidatesConfigBtn" class="admin-btn">👥 Gestionar Candidatos</button>
                <button id="showStudentsConfigBtn" class="admin-btn">📚 Base de Estudiantes</button>
                <button id="resetVotesBtn" class="admin-btn danger">🗳️ Reiniciar Votaciones</button>
                <button id="viewResultsBtn" class="admin-btn warning">📊 Ver Resultados (Gráficos)</button>
                <button id="logoutAdminBtn" class="admin-btn secondary">🚪 Salir Admin</button>
            </div>
            <div id="adminDynamicPanel"></div>
        </div>
    </div>
    <footer>Hecho Por:Jesus Fernández|Sistema en la nube | Los datos se sincronizan en todos los dispositivos</footer>
</div>

<script>
    // 🔥 REEMPLAZA CON TU CONFIGURACIÓN DE FIREBASE (la que copiaste de Firebase console)
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_PROJECT.firebaseapp.com",
        projectId: "TU_PROJECT_ID",
        storageBucket: "TU_PROJECT.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    // Inicializar Firebase si no está ya inicializado
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const dbFirestore = firebase.firestore();

    // Colecciones: config, candidates, students, votes
    let globalData = {
        schoolName: "Colegio Ejemplo",
        schoolLogo: "",
        candidates: [],
        students: [],
        votes: {}     // { studentId: candidateId }
    };

    let adminAuthenticated = false;
    let currentStudent = null;
    let selectedCandidateId = null;
    let resultsChart = null;

    // ------------------ Sincronización en tiempo real ------------------
    function listenFirestore() {
        // Configuración del colegio (documento único "settings")
        dbFirestore.collection("config").doc("main").onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                globalData.schoolName = data.schoolName || "Colegio Ejemplo";
                globalData.schoolLogo = data.schoolLogo || "";
                updateSchoolHeader();
                if (document.getElementById("schoolNameInput")) document.getElementById("schoolNameInput").value = globalData.schoolName;
            } else {
                // inicializar configuración por defecto
                dbFirestore.collection("config").doc("main").set({ schoolName: "Liceo Innovación", schoolLogo: "" });
            }
        });
        // Candidatos
        dbFirestore.collection("candidates").onSnapshot(snapshot => {
            const newCands = [];
            snapshot.forEach(doc => newCands.push({ id: doc.id, ...doc.data() }));
            globalData.candidates = newCands;
            if (currentStudent) refreshVoterArea();
            const panel = document.getElementById("adminDynamicPanel");
            if (panel && panel.innerHTML.includes("candidate-list")) renderCandidatesAdmin();
            if (document.getElementById("viewResultsBtn") && panel && panel.innerHTML.includes("resultsChartCanvas")) renderResultsWithChart();
        });
        // Estudiantes
        dbFirestore.collection("students").onSnapshot(snapshot => {
            const newStudents = [];
            snapshot.forEach(doc => newStudents.push({ id: doc.id, ...doc.data() }));
            globalData.students = newStudents;
            if (currentStudent) {
                const stillExists = globalData.students.find(s => s.id === currentStudent.id);
                if (!stillExists) logoutStudent();
                else refreshVoterArea();
            }
            if (document.getElementById("adminDynamicPanel") && document.getElementById("adminDynamicPanel").innerHTML.includes("studentListAdmin")) renderStudentsAdmin();
        });
        // Votos (mapeo estudiante -> candidato)
        dbFirestore.collection("votes").onSnapshot(snapshot => {
            const newVotes = {};
            snapshot.forEach(doc => { newVotes[doc.id] = doc.data().candidateId; });
            globalData.votes = newVotes;
            if (currentStudent) refreshVoterArea();
            if (document.getElementById("adminDynamicPanel") && document.getElementById("adminDynamicPanel").innerHTML.includes("resultsChartCanvas")) renderResultsWithChart();
        });
    }

    async function updateSchoolSettings(name, logoBase64) {
        await dbFirestore.collection("config").doc("main").set({ schoolName: name, schoolLogo: logoBase64 });
    }
    async function addCandidate(candidate) {
        const docRef = dbFirestore.collection("candidates").doc();
        await docRef.set({ name: candidate.name, corriente: candidate.corriente, photoDataURL: candidate.photoDataURL });
    }
    async function updateCandidate(id, data) {
        await dbFirestore.collection("candidates").doc(id).update(data);
    }
    async function deleteCandidate(id) {
        await dbFirestore.collection("candidates").doc(id).delete();
        // eliminar votos relacionados
        const votesSnapshot = await dbFirestore.collection("votes").where("candidateId", "==", id).get();
        votesSnapshot.forEach(doc => doc.ref.delete());
    }
    async function addStudent(student) {
        await dbFirestore.collection("students").doc(student.id).set({ name: student.name, grade: student.grade });
    }
    async function deleteStudent(id) {
        await dbFirestore.collection("students").doc(id).delete();
        // eliminar su voto si existe
        const voteRef = dbFirestore.collection("votes").doc(id);
        await voteRef.delete();
    }
    async function registerVote(studentId, candidateId) {
        await dbFirestore.collection("votes").doc(studentId).set({ candidateId: candidateId });
    }
    async function resetAllVotes() {
        const snapshot = await dbFirestore.collection("votes").get();
        const batch = dbFirestore.batch();
        snapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
    }

    // ------------------ Funciones de UI (adaptadas a Firestore) ------------------
    function updateSchoolHeader() {
        document.getElementById("schoolNameDisplay").innerText = globalData.schoolName;
        const logoImg = document.getElementById("schoolLogoImg");
        if (globalData.schoolLogo && globalData.schoolLogo.trim() !== "") logoImg.src = globalData.schoolLogo;
        else logoImg.src = "https://via.placeholder.com/70?text=IE";
    }

    function renderCandidatesAdmin() {
        let html = `<div class="form-grid">
                        <div class="form-group"><label>Nombre candidato</label><input id="newCandidateName" placeholder="Ej: Laura Torres"></div>
                        <div class="form-group"><label>Corriente / Lista</label><input id="newCorriente" placeholder="Ej: Movimiento Renovador"></div>
                        <div class="form-group"><label>Foto</label><input type="file" id="newCandidatePhoto" accept="image/*"></div>
                        <div><button id="addCandidateBtn" class="admin-btn">➕ Agregar Candidato</button></div>
                    </div>
                    <div class="candidate-list" id="candidateListAdmin">`;
        globalData.candidates.forEach(c => {
            html += `<div class="candidate-card-admin">
                        <img src="${c.photoDataURL}" class="candidate-img-small" onerror="this.src='https://via.placeholder.com/100'">
                        <strong>${escapeHtml(c.name)}</strong><br>
                        <span style="font-size:0.8rem; color:#d35400;">${escapeHtml(c.corriente)}</span><br>
                        <button class="admin-btn secondary" data-id="${c.id}" data-name="editCandidate">✏️ Editar</button>
                        <button class="admin-btn danger" data-id="${c.id}" data-name="delCandidate">❌ Eliminar</button>
                    </div>`;
        });
        html += `</div>`;
        document.getElementById("adminDynamicPanel").innerHTML = html;
        document.getElementById("addCandidateBtn")?.addEventListener("click", async () => {
            const name = document.getElementById("newCandidateName").value.trim();
            const corriente = document.getElementById("newCorriente").value.trim();
            if (!name) return alert("Escribe nombre");
            const filePhoto = document.getElementById("newCandidatePhoto").files[0];
            let photoURL = "https://randomuser.me/api/portraits/lego/2.jpg";
            if (filePhoto) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    await addCandidate({ name, corriente: corriente || "Sin corriente", photoDataURL: ev.target.result });
                    document.getElementById("newCandidateName").value = "";
                    document.getElementById("newCorriente").value = "";
                };
                reader.readAsDataURL(filePhoto);
            } else {
                await addCandidate({ name, corriente: corriente || "Sin corriente", photoDataURL: photoURL });
                document.getElementById("newCandidateName").value = "";
                document.getElementById("newCorriente").value = "";
            }
        });
        document.querySelectorAll("[data-name='delCandidate']").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");
                if (confirm("Eliminar candidato?")) await deleteCandidate(id);
            });
        });
        document.querySelectorAll("[data-name='editCandidate']").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");
                const candidate = globalData.candidates.find(c => c.id === id);
                const newName = prompt("Nuevo nombre:", candidate.name);
                if (newName && newName.trim()) candidate.name = newName.trim();
                const newCorriente = prompt("Corriente:", candidate.corriente);
                if (newCorriente !== null) candidate.corriente = newCorriente.trim() || "Sin corriente";
                const newPhotoInput = document.createElement("input");
                newPhotoInput.type = "file";
                newPhotoInput.accept = "image/*";
                newPhotoInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = async (ev) => {
                            await updateCandidate(id, { name: candidate.name, corriente: candidate.corriente, photoDataURL: ev.target.result });
                        };
                        reader.readAsDataURL(file);
                    } else {
                        updateCandidate(id, { name: candidate.name, corriente: candidate.corriente });
                    }
                };
                newPhotoInput.click();
                await updateCandidate(id, { name: candidate.name, corriente: candidate.corriente });
            });
        });
    }

    function renderStudentsAdmin() {
        let html = `<div class="form-grid">
                        <div class="form-group"><label>ID Estudiante</label><input id="studentId" placeholder="Ej: EST2024"></div>
                        <div class="form-group"><label>Nombre completo</label><input id="studentName" placeholder="Nombre"></div>
                        <div class="form-group"><label>Grado/Curso</label><input id="studentGrade" placeholder="10°"></div>
                        <div><button id="addStudentBtn" class="admin-btn">➕ Agregar manual</button></div>
                    </div>
                    <div class="form-grid" style="background:#eef2ff;">
                        <div class="form-group"><label>📂 Importar desde Excel/CSV</label><input type="file" id="excelUpload" accept=".csv, .xlsx, .xls, .txt, .csv"></div>
                        <div><button id="importExcelBtn" class="admin-btn">📥 Importar estudiantes</button></div>
                        <div><small>Columnas: id, nombre, grado</small></div>
                    </div>
                    <div class="student-list" id="studentListAdmin">`;
        globalData.students.forEach(s => {
            html += `<div class="student-card"><strong>${escapeHtml(s.id)}</strong><br>${escapeHtml(s.name)}<br>${escapeHtml(s.grade)}<br>
                     <button class="admin-btn danger" data-id="${s.id}" data-name="delStudent">Eliminar</button></div>`;
        });
        html += `</div>`;
        document.getElementById("adminDynamicPanel").innerHTML = html;
        document.getElementById("addStudentBtn")?.addEventListener("click", async () => {
            const id = document.getElementById("studentId").value.trim();
            const name = document.getElementById("studentName").value.trim();
            const grade = document.getElementById("studentGrade").value.trim();
            if (!id || !name) return alert("ID y nombre requeridos");
            if (globalData.students.find(s => s.id === id)) return alert("ID ya existe");
            await addStudent({ id, name, grade: grade || "No especificado" });
            document.getElementById("studentId").value = "";
            document.getElementById("studentName").value = "";
            document.getElementById("studentGrade").value = "";
        });
        document.getElementById("importExcelBtn")?.addEventListener("click", () => {
            const fileInput = document.getElementById("excelUpload");
            if (!fileInput.files.length) return alert("Selecciona un archivo");
            Papa.parse(fileInput.files[0], {
                header: true, skipEmptyLines: true,
                complete: async (results) => {
                    for (const row of results.data) {
                        const id = row.id || row.ID || row.identificador;
                        const name = row.nombre || row.Nombre || row.name;
                        const grade = row.grado || row.Grado || "No especificado";
                        if (id && name && !globalData.students.find(s => s.id === id)) {
                            await addStudent({ id: String(id).trim(), name: String(name).trim(), grade: String(grade).trim() });
                        }
                    }
                    alert("Importación finalizada");
                }
            });
        });
        document.querySelectorAll("[data-name='delStudent']").forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");
                if (confirm("Eliminar estudiante?")) await deleteStudent(id);
            });
        });
    }

    async function renderResultsWithChart() {
        const counts = {};
        globalData.candidates.forEach(c => counts[c.id] = 0);
        Object.values(globalData.votes).forEach(cid => { if (counts[cid] !== undefined) counts[cid]++; });
        const labels = globalData.candidates.map(c => `${c.name} (${c.corriente.substring(0,20)})`);
        const data = globalData.candidates.map(c => counts[c.id] || 0);
        const totalVotes = Object.keys(globalData.votes).length;
        let html = `<div class="results-summary"><h4>📈 Resultados - Total votos: ${totalVotes}</h4>
                    <div class="chart-container"><canvas id="resultsChartCanvas"></canvas></div><ul>`;
        globalData.candidates.forEach(c => {
            html += `<li><strong>${escapeHtml(c.name)}</strong> (${escapeHtml(c.corriente)}) → ${counts[c.id] || 0} votos (${totalVotes ? ((counts[c.id]||0)/totalVotes*100).toFixed(1) : 0}%)</li>`;
        });
        html += `</ul></div>`;
        document.getElementById("adminDynamicPanel").innerHTML = html;
        const ctx = document.getElementById("resultsChartCanvas")?.getContext("2d");
        if (ctx) {
            if (resultsChart) resultsChart.destroy();
            resultsChart = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: 'Votos', data, backgroundColor: '#3498db' }] }, options: { responsive: true } });
        }
    }

    function refreshVoterArea() {
        const ballotDiv = document.getElementById("ballotArea");
        const authMsg = document.getElementById("studentAuthMessage");
        const loginBtn = document.getElementById("loginStudentBtn");
        const logoutBtn = document.getElementById("logoutStudentBtn");
        const studentIdInput = document.getElementById("studentIdInput");

        if (!currentStudent) {
            ballotDiv.innerHTML = `<div class="results-summary">🔐 Inicia sesión con tu ID.</div>`;
            loginBtn.style.display = "inline-block";
            logoutBtn.style.display = "none";
            studentIdInput.disabled = false;
            authMsg.innerHTML = "";
            return;
        }
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        studentIdInput.disabled = true;
        if (globalData.votes[currentStudent.id]) {
            ballotDiv.innerHTML = `<div class="success-message">✅ Ya votaste.</div>`;
            authMsg.innerHTML = `<span>👩‍🎓 ${escapeHtml(currentStudent.name)} (${currentStudent.id}) - Voto registrado.</span>`;
            return;
        }
        authMsg.innerHTML = `<span>🎓 Bienvenido, ${escapeHtml(currentStudent.name)}. Selecciona candidato (aparece X).</span>`;
        if (globalData.candidates.length === 0) { ballotDiv.innerHTML = `<div>No hay candidatos.</div>`; return; }
        let cardsHtml = `<div class="ballot-container">`;
        globalData.candidates.forEach(cand => {
            const isSelected = (selectedCandidateId === cand.id);
            cardsHtml += `<div class="candidate-card-vote ${isSelected ? 'selected' : ''}" data-candidate-id="${cand.id}">
                <div class="photo-wrapper"><img class="candidate-photo" src="${cand.photoDataURL}" onerror="this.src='https://via.placeholder.com/140'"><div class="x-overlay">✘</div></div>
                <div class="candidate-name">${escapeHtml(cand.name)}</div>
                <div class="candidate-corriente">${escapeHtml(cand.corriente)}</div></div>`;
        });
        cardsHtml += `</div><button id="confirmVoteBtn" class="vote-btn">🗳️ CONFIRMAR VOTO (X marcada)</button>`;
        ballotDiv.innerHTML = cardsHtml;
        document.querySelectorAll(".candidate-card-vote").forEach(card => {
            card.addEventListener("click", () => { selectedCandidateId = card.getAttribute("data-candidate-id"); refreshVoterArea(); });
        });
        document.getElementById("confirmVoteBtn")?.addEventListener("click", async () => {
            if (!selectedCandidateId) { alert("Selecciona un candidato."); return; }
            if (globalData.votes[currentStudent.id]) return;
            await registerVote(currentStudent.id, selectedCandidateId);
            selectedCandidateId = null;
            refreshVoterArea();
            document.getElementById("voteResultMessage").innerHTML = `<div class="success-message">✔️ ¡Voto registrado en la nube!</div>`;
            setTimeout(() => document.getElementById("voteResultMessage").innerHTML = "", 3000);
        });
    }

    function logoutStudent() { currentStudent = null; selectedCandidateId = null; document.getElementById("studentIdInput").value = ""; refreshVoterArea(); }
    function loginStudent() {
        const studentId = document.getElementById("studentIdInput").value.trim();
        const studentFound = globalData.students.find(s => s.id === studentId);
        if (!studentFound) { document.getElementById("studentAuthMessage").innerHTML = `<span style="color:red;">❌ ID no registrado.</span>`; return; }
        currentStudent = { ...studentFound };
        selectedCandidateId = null;
        refreshVoterArea();
        document.getElementById("studentAuthMessage").innerHTML = "";
    }

    // Admin auth y modos
    function checkAdminAuth() {
        if (adminAuthenticated) {
            document.getElementById("adminAuthArea").style.display = "none";
            document.getElementById("adminConfigArea").style.display = "block";
            showAdminSection("school");
        } else {
            document.getElementById("adminAuthArea").style.display = "block";
            document.getElementById("adminConfigArea").style.display = "none";
            document.getElementById("adminAuthArea").innerHTML = `<div style="background:#fff3e0; padding:20px; border-radius:24px;">
                <h4>🔒 Acceso administrador</h4><input type="password" id="adminPassword" placeholder="Contraseña" style="width:200px;">
                <button id="submitAdminLogin" class="admin-btn">Ingresar</button><p>Contraseña: admin2025</p></div>`;
            document.getElementById("submitAdminLogin")?.addEventListener("click", () => {
                if (document.getElementById("adminPassword").value === "admin2025") { adminAuthenticated = true; checkAdminAuth(); }
                else alert("Contraseña incorrecta");
            });
        }
    }
    function showAdminSection(section) {
        if (section === "school") {
            document.getElementById("adminDynamicPanel").innerHTML = `<div class="form-grid"><div class="form-group"><label>Nombre Colegio</label><input id="schoolNameInput" value="${escapeHtml(globalData.schoolName)}"></div>
                <div class="form-group"><label>Logo</label><input type="file" id="schoolLogoUpload" accept="image/*"></div><div><button id="saveSchoolBtn" class="admin-btn">Guardar</button></div></div>`;
            document.getElementById("saveSchoolBtn")?.addEventListener("click", () => {
                const newName = document.getElementById("schoolNameInput").value;
                const file = document.getElementById("schoolLogoUpload").files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = async (e) => { await updateSchoolSettings(newName, e.target.result); };
                    reader.readAsDataURL(file);
                } else updateSchoolSettings(newName, globalData.schoolLogo);
            });
        } else if (section === "candidates") renderCandidatesAdmin();
        else if (section === "students") renderStudentsAdmin();
        else if (section === "results") renderResultsWithChart();
    }
    function bindAdminEvents() {
        document.getElementById("showSchoolConfigBtn")?.addEventListener("click", () => showAdminSection("school"));
        document.getElementById("showCandidatesConfigBtn")?.addEventListener("click", () => showAdminSection("candidates"));
        document.getElementById("showStudentsConfigBtn")?.addEventListener("click", () => showAdminSection("students"));
        document.getElementById("viewResultsBtn")?.addEventListener("click", () => showAdminSection("results"));
        document.getElementById("resetVotesBtn")?.addEventListener("click", async () => { if(confirm("Reiniciar votaciones?")) await resetAllVotes(); });
        document.getElementById("logoutAdminBtn")?.addEventListener("click", () => { adminAuthenticated = false; checkAdminAuth(); });
    }
    let currentMode = "voter";
    function setMode(mode) {
        currentMode = mode;
        document.getElementById("voterSection").style.display = mode === "voter" ? "block" : "none";
        document.getElementById("adminSection").style.display = mode === "admin" ? "block" : "none";
        document.getElementById("voterModeBtn").classList.toggle("active", mode === "voter");
        document.getElementById("adminModeBtn").classList.toggle("active", mode === "admin");
        if (mode === "voter") refreshVoterArea();
        else { checkAdminAuth(); bindAdminEvents(); }
    }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    window.onload = () => {
        listenFirestore();
        document.getElementById("loginStudentBtn").addEventListener("click", loginStudent);
        document.getElementById("logoutStudentBtn").addEventListener("click", logoutStudent);
        document.getElementById("voterModeBtn").addEventListener("click", () => setMode("voter"));
        document.getElementById("adminModeBtn").addEventListener("click", () => setMode("admin"));
        setMode("voter");
    };
</script>
</body>
</html>
