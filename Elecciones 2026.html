<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sistema de Votación - Gobierno Estudiantil</title>
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- PapaParse para parsear CSV/Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .school-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .school-logo-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            background: white;
            padding: 5px;
            border: 2px solid gold;
        }

        .school-info h2 {
            font-size: 1.7rem;
            margin-bottom: 5px;
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
        }

        .mode-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #ffc107;
            color: #1e3c72;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .admin-panel {
            border-top: 6px solid #ff9800;
        }

        .voting-panel {
            border-top: 6px solid #4caf50;
        }

        .section-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #1e3c72;
            border-left: 7px solid #ff9800;
            padding-left: 18px;
        }

        .admin-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .admin-btn {
            background: #2c3e66;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .admin-btn.danger {
            background: #c0392b;
        }

        .admin-btn.warning {
            background: #e67e22;
        }

        .admin-btn.secondary {
            background: #7f8c8d;
        }

        .form-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
            background: #f9f9fb;
            padding: 20px;
            border-radius: 24px;
        }

        .form-group {
            flex: 1;
            min-width: 180px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #2c3e66;
        }

        input, select, file-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 40px;
            border: 1px solid #ccc;
            outline: none;
        }

        .candidate-list, .student-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
        }

        .candidate-card-admin, .student-card {
            background: #fef9e6;
            border-radius: 20px;
            padding: 12px;
            width: 210px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .candidate-img-small {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin: 5px auto;
        }

        .ballot-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-top: 20px;
        }

        .candidate-card-vote {
            background: white;
            border-radius: 28px;
            width: 220px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid transparent;
            position: relative;
        }

        .candidate-card-vote.selected {
            border: 3px solid #ff9800;
            background: #fff8e7;
        }

        .photo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 10px;
        }

        .candidate-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .x-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 red;
            backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .candidate-card-vote.selected .x-overlay {
            opacity: 1;
        }

        .candidate-name {
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .candidate-corriente {
            font-size: 0.8rem;
            color: #e67e22;
            font-style: italic;
        }

        .vote-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1.1rem;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
        }

        .student-login-area {
            background: #eef2ff;
            padding: 20px;
            border-radius: 28px;
            margin-bottom: 25px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 40px;
            margin: 15px 0;
        }

        .results-summary {
            background: #e9ecef;
            padding: 15px;
            border-radius: 20px;
            margin-top: 20px;
        }

        .chart-container {
            max-width: 600px;
            margin: 20px auto;
        }

        @media (max-width: 800px) {
            .school-header { flex-direction: column; text-align: center; }
            .candidate-card-vote { width: 180px; }
        }
        footer { text-align: center; margin-top: 30px; color: gray; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="school-header" id="schoolHeader">
        <div class="logo-area">
            <img id="schoolLogoImg" class="school-logo-img" src="https://via.placeholder.com/70?text=Logo" alt="Logo">
            <div class="school-info">
                <h2 id="schoolNameDisplay">Colegio Ejemplo</h2>
                <p>Gobierno Estudiantil - Elecciones 2025</p>
            </div>
        </div>
        <div class="mode-buttons">
            <button id="voterModeBtn" class="mode-btn active">🗳️ Votar</button>
            <button id="adminModeBtn" class="mode-btn">🔧 Administración</button>
        </div>
    </div>

    <!-- Panel Votación -->
    <div id="voterSection" class="card voting-panel">
        <h3 class="section-title">📋 Papeleta Electrónica</h3>
        <div id="voterContent">
            <div class="student-login-area">
                <h4>🔐 Identificación del Estudiante</h4>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="text" id="studentIdInput" placeholder="Ingresa tu ID (ej: EST001)" style="flex:2">
                    <button id="loginStudentBtn" class="admin-btn" style="background:#2c3e66;">Iniciar sesión</button>
                    <button id="logoutStudentBtn" class="admin-btn secondary" style="display:none;">Cerrar sesión</button>
                </div>
                <div id="studentAuthMessage"></div>
            </div>
            <div id="ballotArea"></div>
            <div id="voteResultMessage"></div>
        </div>
    </div>

    <!-- Panel Administración -->
    <div id="adminSection" style="display: none;" class="card admin-panel">
        <h3 class="section-title">⚙️ Panel de Administración</h3>
        <div id="adminAuthArea"></div>
        <div id="adminConfigArea" style="display:none;">
            <div class="admin-buttons">
                <button id="showSchoolConfigBtn" class="admin-btn">🏫 Configurar Colegio</button>
                <button id="showCandidatesConfigBtn" class="admin-btn">👥 Gestionar Candidatos</button>
                <button id="showStudentsConfigBtn" class="admin-btn">📚 Base de Estudiantes</button>
                <button id="resetVotesBtn" class="admin-btn danger">🗳️ Reiniciar Votaciones</button>
                <button id="viewResultsBtn" class="admin-btn warning">📊 Ver Resultados (Gráficos)</button>
                <button id="logoutAdminBtn" class="admin-btn secondary">🚪 Salir Admin</button>
            </div>
            <div id="adminDynamicPanel"></div>
        </div>
    </div>
    <footer>Sistema de Voto Estudiantil | Hecho Por: Ing. Jesus Fernández</footer>
</div>

<script>
    // ---------- MODELO DE DATOS ----------
    let db = {
        schoolName: "Colegio San Alberto Magno",
        schoolLogo: "",
        candidates: [],   // { id, name, corriente, photoDataURL }
        students: [],     // { id, name, grade }
        votes: {}         // { studentId: candidateId }
    };

    let adminAuthenticated = false;
    let currentStudent = null;
    let selectedCandidateId = null;
    let resultsChart = null; // para gráfico

    // Cargar/Guardar datos
    function loadData() {
        const stored = localStorage.getItem("votingSystemData");
        if(stored) {
            try {
                const parsed = JSON.parse(stored);
                db = parsed;
                if(!db.candidates) db.candidates = [];
                if(!db.students) db.students = [];
                if(!db.votes) db.votes = {};
                if(!db.schoolName) db.schoolName = "Colegio San Alberto";
                // Asegurar campo corriente en candidatos antiguos
                db.candidates.forEach(c => { if(!c.corriente) c.corriente = "Sin corriente"; });
            } catch(e) { initDefaultData(); }
        } else {
            initDefaultData();
        }
        db.candidates = db.candidates.map(c => ({
            ...c,
            photoDataURL: c.photoDataURL || "https://randomuser.me/api/portraits/lego/1.jpg",
            corriente: c.corriente || "Independiente"
        }));
        saveData();
    }

    function initDefaultData() {
        db.schoolName = "Liceo Innovación Estudiantil";
        db.schoolLogo = "";
        db.candidates = [
            { id: "c1", name: "Ana María Rojas", corriente: "Movimiento Estudiantil Unido", photoDataURL: "https://randomuser.me/api/portraits/women/68.jpg" },
            { id: "c2", name: "Carlos Méndez", corriente: "Alianza por el Cambio", photoDataURL: "https://randomuser.me/api/portraits/men/32.jpg" },
            { id: "c3", name: "Lucía Fernández", corriente: "Futuro Estudiantil", photoDataURL: "https://randomuser.me/api/portraits/women/44.jpg" }
        ];
        db.students = [
            { id: "EST001", name: "Sofía Pérez", grade: "10°" },
            { id: "EST002", name: "Mateo Gómez", grade: "11°" },
            { id: "EST003", name: "Valentina Díaz", grade: "9°" }
        ];
        db.votes = {};
        saveData();
    }

    function saveData() {
        localStorage.setItem("votingSystemData", JSON.stringify(db));
    }

    function updateSchoolHeader() {
        document.getElementById("schoolNameDisplay").innerText = db.schoolName;
        const logoImg = document.getElementById("schoolLogoImg");
        if(db.schoolLogo && db.schoolLogo.trim() !== "") logoImg.src = db.schoolLogo;
        else logoImg.src = "https://via.placeholder.com/70?text=IE";
    }

    // ---------- ADMIN AUTH ----------
    function checkAdminAuth() {
        if(adminAuthenticated) {
            document.getElementById("adminAuthArea").style.display = "none";
            document.getElementById("adminConfigArea").style.display = "block";
            renderAdminDefaultPanel();
        } else {
            document.getElementById("adminAuthArea").style.display = "block";
            document.getElementById("adminConfigArea").style.display = "none";
            document.getElementById("adminAuthArea").innerHTML = `
                <div style="background:#fff3e0; padding:20px; border-radius:24px;">
                    <h4>🔒 Acceso restringido a administrador</h4>
                    <input type="password" id="adminPassword" placeholder="Contraseña" style="width:200px; margin-right:10px;">
                    <button id="submitAdminLogin" class="admin-btn">Ingresar</button>
                    <p style="margin-top:12px;">Contraseña por defecto: <strong>admin2025</strong></p>
                </div>
            `;
            document.getElementById("submitAdminLogin")?.addEventListener("click", () => {
                if(document.getElementById("adminPassword").value === "admin2025") {
                    adminAuthenticated = true;
                    checkAdminAuth();
                } else alert("Contraseña incorrecta");
            });
        }
    }

    function renderAdminDefaultPanel() { showAdminSection("school"); }

    function showAdminSection(section) {
        const panel = document.getElementById("adminDynamicPanel");
        if(section === "school") {
            panel.innerHTML = `
                <div class="form-grid">
                    <div class="form-group"><label>Nombre del Colegio</label><input type="text" id="schoolNameInput" value="${escapeHtml(db.schoolName)}"></div>
                    <div class="form-group"><label>Logo (imagen)</label><input type="file" id="schoolLogoUpload" accept="image/*"></div>
                    <div><button id="saveSchoolBtn" class="admin-btn">Guardar cambios</button></div>
                </div>
                ${db.schoolLogo ? '<img src="'+db.schoolLogo+'" style="width:80px; border-radius:50%;">' : ''}
            `;
            document.getElementById("saveSchoolBtn")?.addEventListener("click", () => {
                const newName = document.getElementById("schoolNameInput").value;
                if(newName) db.schoolName = newName;
                const file = document.getElementById("schoolLogoUpload").files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = e => { db.schoolLogo = e.target.result; saveData(); updateSchoolHeader(); renderAdminDefaultPanel(); };
                    reader.readAsDataURL(file);
                } else { saveData(); updateSchoolHeader(); renderAdminDefaultPanel(); }
            });
        }
        else if(section === "candidates") renderCandidatesAdmin();
        else if(section === "students") renderStudentsAdmin();
        else if(section === "results") renderResultsWithChart();
    }

    // ---------- CANDIDATOS CON CORRIENTE ----------
    function renderCandidatesAdmin() {
        let html = `<div class="form-grid">
                        <div class="form-group"><label>Nombre candidato</label><input id="newCandidateName" placeholder="Ej: Laura Torres"></div>
                        <div class="form-group"><label>Corriente / Lista</label><input id="newCorriente" placeholder="Ej: Movimiento Renovador"></div>
                        <div class="form-group"><label>Foto</label><input type="file" id="newCandidatePhoto" accept="image/*"></div>
                        <div><button id="addCandidateBtn" class="admin-btn">➕ Agregar Candidato</button></div>
                    </div>
                    <div class="candidate-list" id="candidateListAdmin">`;
        db.candidates.forEach(c => {
            html += `<div class="candidate-card-admin">
                        <img src="${c.photoDataURL}" class="candidate-img-small" onerror="this.src='https://via.placeholder.com/100'">
                        <strong>${escapeHtml(c.name)}</strong><br>
                        <span style="font-size:0.8rem; color:#d35400;">${escapeHtml(c.corriente)}</span><br>
                        <button class="admin-btn secondary" data-id="${c.id}" data-name="editCandidate">✏️ Editar</button>
                        <button class="admin-btn danger" data-id="${c.id}" data-name="delCandidate">❌ Eliminar</button>
                    </div>`;
        });
        html += `</div>`;
        document.getElementById("adminDynamicPanel").innerHTML = html;
        document.getElementById("addCandidateBtn")?.addEventListener("click", () => {
            const name = document.getElementById("newCandidateName").value.trim();
            const corriente = document.getElementById("newCorriente").value.trim();
            if(!name) return alert("Escribe nombre");
            const filePhoto = document.getElementById("newCandidatePhoto").files[0];
            const addCandidate = (photoURL) => {
                const newId = "cand_" + Date.now() + "_" + Math.floor(Math.random()*1000);
                db.candidates.push({ id: newId, name: name, corriente: corriente || "Sin corriente", photoDataURL: photoURL });
                saveData();
                renderCandidatesAdmin();
                if(currentStudent) refreshVoterArea();
            };
            if(filePhoto) {
                const reader = new FileReader();
                reader.onload = ev => addCandidate(ev.target.result);
                reader.readAsDataURL(filePhoto);
            } else addCandidate("https://randomuser.me/api/portraits/lego/2.jpg");
        });
        document.querySelectorAll("[data-name='delCandidate']").forEach(btn => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-id");
                if(confirm("Eliminar candidato? Se pierden sus votos.")) {
                    db.candidates = db.candidates.filter(c => c.id !== id);
                    for(let sid in db.votes) if(db.votes[sid] === id) delete db.votes[sid];
                    saveData();
                    renderCandidatesAdmin();
                    if(currentStudent) refreshVoterArea();
                }
            });
        });
        document.querySelectorAll("[data-name='editCandidate']").forEach(btn => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-id");
                const candidate = db.candidates.find(c => c.id === id);
                const newName = prompt("Nuevo nombre:", candidate.name);
                if(newName && newName.trim()) candidate.name = newName.trim();
                const newCorriente = prompt("Corriente / lista:", candidate.corriente);
                if(newCorriente !== null) candidate.corriente = newCorriente.trim() || "Sin corriente";
                const newPhotoInput = document.createElement("input");
                newPhotoInput.type = "file";
                newPhotoInput.accept = "image/*";
                newPhotoInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if(file) {
                        const reader = new FileReader();
                        reader.onload = ev => { candidate.photoDataURL = ev.target.result; saveData(); renderCandidatesAdmin(); refreshVoterArea(); };
                        reader.readAsDataURL(file);
                    } else { saveData(); renderCandidatesAdmin(); refreshVoterArea(); }
                };
                newPhotoInput.click();
                saveData();
                renderCandidatesAdmin();
                refreshVoterArea();
            });
        });
    }

    // ---------- ESTUDIANTES: CARGA EXCEL (CSV) ----------
    function renderStudentsAdmin() {
        let html = `<div class="form-grid">
                        <div class="form-group"><label>ID Estudiante</label><input id="studentId" placeholder="Ej: EST2024"></div>
                        <div class="form-group"><label>Nombre completo</label><input id="studentName" placeholder="Nombre"></div>
                        <div class="form-group"><label>Grado/Curso</label><input id="studentGrade" placeholder="10°"></div>
                        <div><button id="addStudentBtn" class="admin-btn">➕ Agregar manual</button></div>
                    </div>
                    <div class="form-grid" style="background:#eef2ff;">
                        <div class="form-group"><label>📂 Importar desde Excel/CSV</label><input type="file" id="excelUpload" accept=".csv, .xlsx, .xls, .txt, .csv"></div>
                        <div><button id="importExcelBtn" class="admin-btn">📥 Importar estudiantes</button></div>
                        <div><small>El archivo debe tener columnas: <strong>id, nombre, grado</strong> (pueden ir separados por comas o punto y coma)</small></div>
                    </div>
                    <div class="student-list" id="studentListAdmin">`;
        db.students.forEach(s => {
            html += `<div class="student-card"><strong>${escapeHtml(s.id)}</strong><br>${escapeHtml(s.name)}<br>${escapeHtml(s.grade)}<br>
                     <button class="admin-btn danger" data-id="${s.id}" data-name="delStudent">Eliminar</button></div>`;
        });
        html += `</div>`;
        document.getElementById("adminDynamicPanel").innerHTML = html;
        document.getElementById("addStudentBtn")?.addEventListener("click", () => {
            const id = document.getElementById("studentId").value.trim();
            const name = document.getElementById("studentName").value.trim();
            const grade = document.getElementById("studentGrade").value.trim();
            if(!id || !name) return alert("ID y nombre requeridos");
            if(db.students.find(s => s.id === id)) return alert("ID ya existe");
            db.students.push({ id, name, grade: grade || "No especificado" });
            saveData();
            renderStudentsAdmin();
        });
        document.getElementById("importExcelBtn")?.addEventListener("click", () => {
            const fileInput = document.getElementById("excelUpload");
            if(!fileInput.files.length) return alert("Selecciona un archivo CSV o Excel (se usará CSV)");
            const file = fileInput.files[0];
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    let importedCount = 0;
                    results.data.forEach(row => {
                        // buscamos columnas flexibles: id, nombre, grado (pueden ser id, ID, nombre, Nombre, grado, Grado)
                        const id = row.id || row.ID || row.identificador || row["Id"];
                        const name = row.nombre || row.Nombre || row.name || row.Name;
                        const grade = row.grado || row.Grado || row.curso || row.Curso || "No especificado";
                        if(id && name && !db.students.find(s => s.id === id)) {
                            db.students.push({ id: String(id).trim(), name: String(name).trim(), grade: String(grade).trim() });
                            importedCount++;
                        }
                    });
                    saveData();
                    renderStudentsAdmin();
                    alert(`Se importaron ${importedCount} estudiantes nuevos.`);
                },
                error: function(err) { alert("Error al leer el archivo: " + err.message); }
            });
        });
        document.querySelectorAll("[data-name='delStudent']").forEach(btn => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-id");
                if(confirm(`Eliminar estudiante ${id}?`)) {
                    db.students = db.students.filter(s => s.id !== id);
                    delete db.votes[id];
                    saveData();
                    renderStudentsAdmin();
                    if(currentStudent && currentStudent.id === id) { currentStudent = null; refreshVoterArea(); }
                }
            });
        });
    }

    // ---------- RESULTADOS CON GRÁFICO ----------
    function renderResultsWithChart() {
        const counts = {};
        db.candidates.forEach(c => counts[c.id] = 0);
        Object.values(db.votes).forEach(cid => { if(counts[cid] !== undefined) counts[cid]++; });
        const labels = db.candidates.map(c => `${c.name} (${c.corriente.substring(0,20)})`);
        const data = db.candidates.map(c => counts[c.id] || 0);
        const totalVotes = Object.keys(db.votes).length;
        let html = `<div class="results-summary">
                        <h4>📈 Resultados actuales - Total votos: ${totalVotes}</h4>
                        <div class="chart-container">
                            <canvas id="resultsChartCanvas" width="400" height="400"></canvas>
                        </div>
                        <ul style="margin-top:20px;">`;
        db.candidates.forEach(c => {
            html += `<li><strong>${escapeHtml(c.name)}</strong> (${escapeHtml(c.corriente)}) → ${counts[c.id] || 0} votos (${totalVotes ? ((counts[c.id]||0)/totalVotes*100).toFixed(1) : 0}%)</li>`;
        });
        html += `</ul></div>`;
        document.getElementById("adminDynamicPanel").innerHTML = html;

        const ctx = document.getElementById("resultsChartCanvas")?.getContext("2d");
        if(ctx) {
            if(resultsChart) resultsChart.destroy();
            resultsChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Votos', data: data, backgroundColor: '#3498db', borderRadius: 10 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' }, title: { display: true, text: 'Votos por candidato' } } }
            });
        }
    }

    // ---------- VOTACIÓN ESTUDIANTIL (con corriente visible) ----------
    function refreshVoterArea() {
        const ballotDiv = document.getElementById("ballotArea");
        const msgDiv = document.getElementById("voteResultMessage");
        const authMsg = document.getElementById("studentAuthMessage");
        const loginBtn = document.getElementById("loginStudentBtn");
        const logoutBtn = document.getElementById("logoutStudentBtn");
        const studentIdInput = document.getElementById("studentIdInput");

        if(!currentStudent) {
            ballotDiv.innerHTML = `<div class="results-summary">🔐 Inicia sesión con tu ID para votar.</div>`;
            if(msgDiv) msgDiv.innerHTML = "";
            loginBtn.style.display = "inline-block";
            logoutBtn.style.display = "none";
            studentIdInput.disabled = false;
            authMsg.innerHTML = "";
            return;
        }

        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
        studentIdInput.disabled = true;
        const hasVoted = db.votes.hasOwnProperty(currentStudent.id);
        if(hasVoted) {
            ballotDiv.innerHTML = `<div class="success-message">✅ Ya has emitido tu voto. Gracias.</div>`;
            authMsg.innerHTML = `<span>👩‍🎓 ${escapeHtml(currentStudent.name)} (${currentStudent.id}) - Ya votaste.</span>`;
            return;
        }
        authMsg.innerHTML = `<span>🎓 Bienvenido, ${escapeHtml(currentStudent.name)}. Selecciona un candidato (aparecerá la X).</span>`;
        if(db.candidates.length === 0) { ballotDiv.innerHTML = `<div>No hay candidatos.</div>`; return; }

        let cardsHtml = `<div class="ballot-container">`;
        db.candidates.forEach(cand => {
            const isSelected = (selectedCandidateId === cand.id);
            cardsHtml += `
                <div class="candidate-card-vote ${isSelected ? 'selected' : ''}" data-candidate-id="${cand.id}">
                    <div class="photo-wrapper">
                        <img class="candidate-photo" src="${cand.photoDataURL}" onerror="this.src='https://via.placeholder.com/140'">
                        <div class="x-overlay">✘</div>
                    </div>
                    <div class="candidate-name">${escapeHtml(cand.name)}</div>
                    <div class="candidate-corriente">${escapeHtml(cand.corriente)}</div>
                </div>
            `;
        });
        cardsHtml += `</div><button id="confirmVoteBtn" class="vote-btn">🗳️ CONFIRMAR VOTO (X marcada)</button>`;
        ballotDiv.innerHTML = cardsHtml;

        document.querySelectorAll(".candidate-card-vote").forEach(card => {
            card.addEventListener("click", () => {
                selectedCandidateId = card.getAttribute("data-candidate-id");
                refreshVoterArea();
            });
        });
        document.getElementById("confirmVoteBtn")?.addEventListener("click", () => {
            if(!selectedCandidateId) { alert("Selecciona un candidato haciendo clic en su foto."); return; }
            if(db.votes[currentStudent.id]) { alert("Ya votaste."); return; }
            db.votes[currentStudent.id] = selectedCandidateId;
            saveData();
            selectedCandidateId = null;
            refreshVoterArea();
            document.getElementById("voteResultMessage").innerHTML = `<div class="success-message">✔️ ¡Voto registrado! X confirmada.</div>`;
            setTimeout(() => document.getElementById("voteResultMessage").innerHTML = "", 3000);
        });
    }

    function logoutStudent() {
        currentStudent = null;
        selectedCandidateId = null;
        document.getElementById("studentIdInput").value = "";
        refreshVoterArea();
        document.getElementById("loginStudentBtn").style.display = "inline-block";
        document.getElementById("logoutStudentBtn").style.display = "none";
        document.getElementById("studentIdInput").disabled = false;
    }
    function loginStudent() {
        const studentId = document.getElementById("studentIdInput").value.trim();
        const studentFound = db.students.find(s => s.id === studentId);
        if(!studentFound) { document.getElementById("studentAuthMessage").innerHTML = `<span style="color:red;">❌ ID no registrado.</span>`; return; }
        currentStudent = { ...studentFound };
        selectedCandidateId = null;
        refreshVoterArea();
        document.getElementById("studentAuthMessage").innerHTML = "";
    }

    // Modo y eventos
    let currentMode = "voter";
    function setMode(mode) {
        currentMode = mode;
        document.getElementById("voterSection").style.display = mode === "voter" ? "block" : "none";
        document.getElementById("adminSection").style.display = mode === "admin" ? "block" : "none";
        document.getElementById("voterModeBtn").classList.toggle("active", mode === "voter");
        document.getElementById("adminModeBtn").classList.toggle("active", mode === "admin");
        if(mode === "voter") refreshVoterArea();
        else { checkAdminAuth(); bindAdminEvents(); }
    }
    function bindAdminEvents() {
        document.getElementById("showSchoolConfigBtn")?.addEventListener("click", () => showAdminSection("school"));
        document.getElementById("showCandidatesConfigBtn")?.addEventListener("click", () => showAdminSection("candidates"));
        document.getElementById("showStudentsConfigBtn")?.addEventListener("click", () => showAdminSection("students"));
        document.getElementById("viewResultsBtn")?.addEventListener("click", () => showAdminSection("results"));
        document.getElementById("resetVotesBtn")?.addEventListener("click", () => { if(confirm("Reiniciar todas las votaciones?")) { db.votes = {}; saveData(); if(currentStudent) refreshVoterArea(); showAdminSection("results"); alert("Votos reiniciados."); } });
        document.getElementById("logoutAdminBtn")?.addEventListener("click", () => { adminAuthenticated = false; checkAdminAuth(); });
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    window.onload = () => {
        loadData();
        updateSchoolHeader();
        document.getElementById("loginStudentBtn").addEventListener("click", loginStudent);
        document.getElementById("logoutStudentBtn").addEventListener("click", logoutStudent);
        document.getElementById("voterModeBtn").addEventListener("click", () => setMode("voter"));
        document.getElementById("adminModeBtn").addEventListener("click", () => setMode("admin"));
        setMode("voter");
    };
</script>
</body>
</html>
